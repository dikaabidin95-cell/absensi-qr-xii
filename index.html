<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Scanner Absensi XII</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 10px 16px 20px;

      background: #f5f7fa;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    h1 {

      margin: 4px 0 2px;

      font-size: 25px;

      line-height: 1.2;

    }


    .subtitle {

      color: #666;

      font-size: 15px;

      margin-bottom: 8px;

    }


    /* =========================================
       AREA SCANNER
       ========================================= */

    #scanner-wrapper {

      width: 100%;

      max-width: 430px;

      margin: 0 auto;

      position: relative;

    }


    #reader {

      width: 100%;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      transition: filter 0.15s ease;

    }


    /*
     * Ketika sedang memproses,
     * tampilan kamera dibuat blur.
     */

    #reader.processing {

      filter: blur(6px);

    }


    /* =========================================
       OVERLAY MEMPROSES
       ========================================= */

    #processing-overlay {

      position: absolute;

      inset: 0;

      z-index: 20;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      padding: 20px;

      background: rgba(255, 255, 255, 0.72);

      border-radius: 14px;

      backdrop-filter: blur(2px);

    }


    #processing-overlay.active {

      display: flex;

    }


    .processing-icon {

      width: 48px;

      height: 48px;

      border: 5px solid #f0c419;

      border-top-color: transparent;

      border-radius: 50%;

      animation: putar 0.9s linear infinite;

      margin-bottom: 12px;

    }


    @keyframes putar {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }


    .processing-title {

      font-size: 27px;

      font-weight: bold;

      color: #b07a00;

      line-height: 1.1;

    }


    .processing-text {

      margin-top: 8px;

      font-size: 16px;

      color: #444;

      line-height: 1.35;

      max-width: 300px;

    }


    .processing-note {

      margin-top: 14px;

      padding: 9px 14px;

      border: 1px solid #aaa;

      border-radius: 10px;

      background: rgba(255,255,255,0.75);

      font-size: 14px;

      color: #333;

      line-height: 1.3;

    }


    /* =========================================
       HASIL SCAN
       ========================================= */

    #hasil {

      width: 100%;

      max-width: 430px;

      min-height: 135px;

      margin: 10px auto 0;

      padding: 14px 10px;

      background: #ffffff;

      border-radius: 14px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      overflow: hidden;

    }


    /* =========================================
       MENUNGGU
       ========================================= */

    .menunggu {

      color: #777;

      font-size: 18px;

      font-weight: normal;

    }


    /* =========================================
       HADIR
       ========================================= */

    .hadir {

      color: #168a3a;

      font-size: 30px;

      font-weight: bold;

      line-height: 1.1;

      margin-bottom: 7px;

    }


    /* =========================================
       NAMA ADAPTIF
       ========================================= */

    .nama-siswa {

      color: #111;

      width: 100%;

      max-width: 100%;

      font-weight: bold;

      line-height: 1.18;

      text-align: center;

      overflow-wrap: anywhere;

      word-break: normal;

      padding: 0 4px;

    }


    .nama-pendek {

      font-size: 22px;

    }


    .nama-sedang {

      font-size: 20px;

    }


    .nama-panjang {

      font-size: 18px;

    }


    .nama-sangat-panjang {

      font-size: 16px;

    }


    /* =========================================
       KELAS
       ========================================= */

    .kelas-siswa {

      color: #555;

      font-size: 16px;

      margin-top: 5px;

    }


    /* =========================================
       SUDAH ABSEN
       ========================================= */

    .sudah {

      color: #d68b00;

      font-size: 28px;

      font-weight: bold;

      line-height: 1.1;

      margin-bottom: 7px;

    }


    /* =========================================
       ERROR
       ========================================= */

    .error {

      color: #c62828;

      font-size: 21px;

      font-weight: bold;

      line-height: 1.2;

      padding: 0 8px;

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 360px) {

      body {

        padding-left: 10px;

        padding-right: 10px;

      }


      h1 {

        font-size: 22px;

      }


      .subtitle {

        font-size: 14px;

      }


      .processing-title {

        font-size: 24px;

      }


      .processing-text {

        font-size: 14px;

      }


      .hadir {

        font-size: 27px;

      }


      .sudah {

        font-size: 25px;

      }

    }

  </style>

</head>


<body>


  <h1>
    ABSENSI KIMIA XII
  </h1>


  <div class="subtitle">
    Arahkan QR siswa ke kamera
  </div>


  <!-- =========================================
       SCANNER
       ========================================= -->

  <div id="scanner-wrapper">


    <div id="reader"></div>


    <!-- =======================================
         OVERLAY MEMPROSES
         ======================================= -->

    <div id="processing-overlay">


      <div class="processing-icon"></div>


      <div class="processing-title">
        MEMPROSES...
      </div>


      <div class="processing-text">
        Data sedang diverifikasi dan dicatat.
      </div>


      <div class="processing-note">
        QR boleh dilepas.
        <br>
        Tunggu hasil absensi.
      </div>


    </div>


  </div>


  <!-- =========================================
       HASIL
       ========================================= -->

  <div id="hasil">

    <div class="menunggu">
      MENUNGGU SCAN
    </div>

  </div>



<script>


  /* =========================================
     URL APPS SCRIPT
     ========================================= */

  const API_URL =
    "https://script.google.com/a/macros/guru.sma.belajar.id/s/AKfycbxy_OJolL3936qcPsBAQ2mTrBdgwvDXPoTP-omVG_GxMtpYjJGXCjSQhls89OUMRJN1Jw/exec";


  let scanner = null;

  let sedangMemproses = false;


  /* =========================================
     MULAI SCANNER
     ========================================= */

  function mulaiScanner() {


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },


      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      function(decodedText) {


        /*
         * Jika sedang memproses,
         * abaikan pembacaan QR berikutnya.
         */

        if (sedangMemproses) {

          return;

        }


        sedangMemproses = true;


        /*
         * LANGSUNG tampilkan
         * MEMPROSES...
         *
         * Tidak menunggu server.
         */

        tampilkanMemproses();


        /*
         * Kirim QR ke Apps Script.
         */

        kirimKeAppsScript(decodedText);

      },


      function(errorMessage) {

        /*
         * Tidak melakukan apa-apa.
         *
         * Scanner tetap aktif.
         */

      }

    )

    .catch(function(error) {


      console.error(error);


      tampilkanError(
        "KAMERA TIDAK DAPAT DIAKTIFKAN"
      );


    });

  }


  /* =========================================
     TAMPILKAN MEMPROSES
     ========================================= */

  function tampilkanMemproses() {


    /*
     * Blur kamera.
     */

    document
      .getElementById("reader")
      .classList
      .add("processing");


    /*
     * Tampilkan overlay.
     */

    document
      .getElementById("processing-overlay")
      .classList
      .add("active");


  }


  /* =========================================
     HILANGKAN MEMPROSES
     ========================================= */

  function sembunyikanMemproses() {


    document
      .getElementById("reader")
      .classList
      .remove("processing");


    document
      .getElementById("processing-overlay")
      .classList
      .remove("active");


  }


  /* =========================================
     KIRIM QR KE APPS SCRIPT
     ========================================= */

  function kirimKeAppsScript(qrId) {


    const namaCallback =
      "absensiCallback_" +
      Date.now();


    window[namaCallback] =
      function(data) {


        try {

          prosesHasil(
            data,
            qrId
          );

        }

        finally {

          delete window[namaCallback];

        }

      };


    const url =
      API_URL +
      "?qr=" +
      encodeURIComponent(qrId) +
      "&callback=" +
      namaCallback;


    const script =
      document.createElement("script");


    script.src = url;


    script.onerror =
      function() {


        sembunyikanMemproses();


        tampilkanError(
          "GAGAL MENGHUBUNGI SERVER"
        );


        delete window[namaCallback];


        setTimeout(function() {

          sedangMemproses = false;

        }, 3000);


      };


    document.body.appendChild(script);


    setTimeout(function() {


      if (script.parentNode) {

        script.parentNode.removeChild(script);

      }


    }, 5000);

  }


  /* =========================================
     UKURAN NAMA
     ========================================= */

  function kelasNama(nama) {


    const jumlahKarakter =
      nama.length;


    if (jumlahKarakter <= 20) {

      return "nama-pendek";

    }


    if (jumlahKarakter <= 28) {

      return "nama-sedang";

    }


    if (jumlahKarakter <= 38) {

      return "nama-panjang";

    }


    return "nama-sangat-panjang";

  }


  /* =========================================
     HASIL DARI APPS SCRIPT
     ========================================= */

  function prosesHasil(data, qrId) {


    /*
     * Hapus overlay MEMPROSES
     * terlebih dahulu.
     */

    sembunyikanMemproses();


    /* =======================================
       HADIR
       ======================================= */

    if (data.status === "HADIR") {


      const kelasNamaSiswa =
        kelasNama(data.nama);


      document.getElementById(
        "hasil"
      ).innerHTML = `

        <div class="hadir">
          ● HADIR
        </div>

        <div class="nama-siswa ${kelasNamaSiswa}">
          ${data.nama}
        </div>

        <div class="kelas-siswa">
          ${data.kelas}
        </div>

      `;


      bunyi();

    }


    /* =======================================
       SUDAH ABSEN
       ======================================= */

    else if (
      data.status === "SUDAH_ABSEN"
    ) {


      const kelasNamaSiswa =
        kelasNama(data.nama);


      document.getElementById(
        "hasil"
      ).innerHTML = `

        <div class="sudah">
          ● SUDAH ABSEN
        </div>

        <div class="nama-siswa ${kelasNamaSiswa}">
          ${data.nama}
        </div>

        <div class="kelas-siswa">
          ${data.kelas}
        </div>

      `;


      bunyi();

    }


    /* =======================================
       QR TIDAK DIKENAL
       ======================================= */

    else if (
      data.status === "QR_TIDAK_DIKENAL"
    ) {


      document.getElementById(
        "hasil"
      ).innerHTML = `

        <div class="error">
          ● QR TIDAK DIKENAL
        </div>

        <div style="
          margin-top:8px;
          font-size:17px;
          color:#555;
        ">
          ID:
          <strong>
            ${qrId}
          </strong>
        </div>

      `;

    }


    /* =======================================
       SCANNER NONAKTIF
       ======================================= */

    else if (
      data.status === "SCANNER_NONAKTIF"
    ) {


      document.getElementById(
        "hasil"
      ).innerHTML = `

        <div class="error">
          ● SCANNER NONAKTIF
        </div>

      `;

    }


    /* =======================================
       ERROR LAIN
       ======================================= */

    else {


      document.getElementById(
        "hasil"
      ).innerHTML = `

        <div class="error">
          ● TERJADI KESALAHAN
        </div>

      `;

    }


    /*
     * =======================================
     * HASIL DITAMPILKAN 3 DETIK
     * =======================================
     */

    setTimeout(function() {


      sedangMemproses = false;


      document.getElementById(
        "hasil"
      ).innerHTML = `

        <div class="menunggu">
          MENUNGGU SCAN
        </div>

      `;


    }, 3000);

  }


  /* =========================================
     BUNYI
     ========================================= */

  function bunyi() {


    try {


      const context =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      if (
        context.state === "suspended"
      ) {

        context.resume();

      }


      const oscillator =
        context.createOscillator();


      const gain =
        context.createGain();


      oscillator.connect(gain);

      gain.connect(
        context.destination
      );


      oscillator.frequency.value =
        880;


      gain.gain.value =
        0.15;


      oscillator.start();


      oscillator.stop(
        context.currentTime + 0.12
      );


    }

    catch (error) {


      console.log(
        "Bunyi tidak tersedia:",
        error
      );


    }

  }


  /* =========================================
     ERROR
     ========================================= */

  function tampilkanError(pesan) {


    sembunyikanMemproses();


    document.getElementById(
      "hasil"
    ).innerHTML = `

      <div class="error">
        ● ${pesan}
      </div>

    `;

  }


  /* =========================================
     MULAI
     ========================================= */

  window.onload =
    function() {

      mulaiScanner();

    };


</script>


</body>

</html>
