<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Absensi TKA Kimia 2026</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 10px 12px 20px;

      background: #f5f7fa;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    h1 {

      margin: 4px 0 2px;

      font-size: 25px;

      line-height: 1.2;

    }


    .subtitle {

      color: #666;

      font-size: 15px;

      margin-bottom: 8px;

    }


    /* =================================================
       STAGE UTAMA
       Kamera, MEMPROSES, dan HADIR
       berada pada area yang SAMA.
       ================================================= */

    #scanner-stage {

      width: 100%;

      max-width: 430px;

      height: min(68vh, 520px);

      min-height: 430px;

      margin: 0 auto;

      position: relative;

      overflow: hidden;

      border-radius: 16px;

      background: #000;

    }


    /* =================================================
       LAPISAN 1 — KAMERA
       ================================================= */

    #reader {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      background: #000;

      overflow: hidden;

      z-index: 1;

      transition:
        filter 0.15s ease;

    }


    #reader.processing {

  filter: none;

}

    /* =================================================
       LAPISAN 2 — MEMPROSES
       ================================================= */

    #processing-overlay {

      position: absolute;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      padding: 20px;

      background:
        rgba(10, 25, 30, 0.58);

      
      color: white;

    }


    #processing-overlay.active {

      display: flex;

    }


    .processing-card {

      width: 88%;

      max-width: 330px;

      padding: 25px 18px;

      border:
        3px solid #f5bd27;

      border-radius: 20px;

      background:
        rgba(20, 25, 25, 0.72);

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.3);

    }


    .processing-icon {

      width: 52px;

      height: 52px;

      margin: 0 auto 13px;

      border:
        6px solid #f5bd27;

      border-top-color:
        transparent;

      border-radius: 50%;

      animation:
        putar 0.9s linear infinite;

    }


    @keyframes putar {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    .processing-title {

      font-size: 27px;

      font-weight: bold;

      color: #ffd044;

    }


    .processing-text {

      margin-top: 10px;

      font-size: 16px;

      line-height: 1.4;

    }


    .processing-note {

      margin-top: 17px;

      padding: 10px 12px;

      border:
        1px solid
        rgba(255,255,255,0.5);

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.4;

    }


    /* =================================================
       LAPISAN 3 — HASIL HADIR
       INI MENUTUP KAMERA SEPENUHNYA
       ================================================= */

    #result-overlay {

      position: absolute;

      inset: 0;

      z-index: 200;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      padding: 18px 15px;

      color: white;

      background:
        linear-gradient(
          180deg,
          #082c31 0%,
          #061b20 100%
        );

      text-align: center;

      overflow: hidden;

    }


    #result-overlay.active {

  display: flex;

  opacity: 1;

  visibility: visible;

  transition:
    opacity 0.15s ease;

}
    #result-overlay.fade-out {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}

    /* =================================================
       ICON HADIR
       ================================================= */

    .check-circle {

      width: 70px;

      height: 70px;

      flex-shrink: 0;

      border:
        5px solid #65e85b;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 7px;

      box-shadow:
        0 0 18px
        rgba(101,232,91,0.35);

    }


    .check-mark {

      font-size: 47px;

      line-height: 1;

      font-weight: bold;

      color: #65e85b;

      transform:
        translateY(-2px);

    }


    .result-status {

      font-size: 34px;

      font-weight: bold;

      color: #65e85b;

      line-height: 1.05;

    }


    .result-id {

      margin-top: 7px;

      font-size: 19px;

      font-weight: bold;

      color: white;

    }


    .result-name {

      margin-top: 4px;

      width: 100%;

      font-weight: bold;

      line-height: 1.15;

      color: white;

      padding: 0 4px;

      overflow-wrap: anywhere;

    }


    .nama-pendek {

      font-size: 21px;

    }


    .nama-sedang {

      font-size: 19px;

    }


    .nama-panjang {

      font-size: 17px;

    }


    .nama-sangat-panjang {

      font-size: 15px;

    }


    .result-class {

      margin-top: 4px;

      font-size: 15px;

      color: #e3eeee;

    }


    .result-line {

      width: 88%;

      max-width: 330px;

      margin: 10px auto 8px;

      border: 0;

      border-top:
        1px solid
        rgba(255,255,255,0.25);

    }


    /* =================================================
       INFORMASI ABSENSI
       ================================================= */

    .result-info {

      width: 100%;

      max-width: 330px;

      text-align: left;

      font-size: 14px;

      line-height: 1.55;

    }


    .info-row {

      display: grid;

      grid-template-columns:
        25px 1fr auto;

      align-items: center;

      column-gap: 4px;

    }


    .info-icon {

      font-size: 16px;

    }


    .info-label {

      color: #d8e6e8;

    }


    .info-value {

      color: white;

      font-weight: bold;

      text-align: right;

    }


    /* =================================================
       PESAN SUKSES
       ================================================= */

    .success-note {

      width: 100%;

      max-width: 330px;

      margin-top: 10px;

      padding: 8px 10px;

      border:
        2px solid #65e85b;

      border-radius: 10px;

      background:
        rgba(25,100,45,0.25);

      font-size: 14px;

      line-height: 1.3;

      color: white;

    }


    /* =================================================
       SUDAH ABSEN
       ================================================= */

    .duplicate-icon {

      width: 68px;

      height: 68px;

      border:
        5px solid #f4b63e;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 9px;

    }


    .duplicate-mark {

      font-size: 38px;

      font-weight: bold;

      color: #f4b63e;

    }


    .duplicate-status {

      font-size: 27px;

      font-weight: bold;

      color: #f4b63e;

    }


    /* =================================================
       ERROR
       ================================================= */

    .error-icon {

      font-size: 42px;

      color: #ff6b6b;

      margin-bottom: 8px;

    }


    .error-title {

      font-size: 24px;

      font-weight: bold;

      color: #ff6b6b;

    }


    .error-text {

      margin-top: 8px;

      font-size: 16px;

      color: white;

    }


    /* =================================================
       HP KECIL
       ================================================= */

    @media (max-width: 360px) {

      body {

        padding-left: 8px;

        padding-right: 8px;

      }


      h1 {

        font-size: 22px;

      }


      .subtitle {

        font-size: 14px;

      }


      #scanner-stage {

        min-height: 400px;

        height: 66vh;

      }


      .result-status {

        font-size: 30px;

      }


      .result-id {

        font-size: 18px;

      }


      .nama-pendek {

        font-size: 19px;

      }


      .nama-sedang {

        font-size: 17px;

      }


      .nama-panjang {

        font-size: 15px;

      }


      .nama-sangat-panjang {

        font-size: 14px;

      }


      .result-info {

        font-size: 13px;

      }


      .success-note {

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


  <h1>
    ABSENSI TKA KIMIA 2026
  </h1>


  <div class="subtitle">
    Scanner QR Siswa
  </div>


  <!-- =================================================
       SATU STAGE
       ================================================= -->

  <div id="scanner-stage">


    <!-- ===============================================
         KAMERA
         =============================================== -->

    <div id="reader"></div>


    <!-- ===============================================
         MEMPROSES
         =============================================== -->

    <div id="processing-overlay">


      <div class="processing-card">


        <div class="processing-icon"></div>


        <div class="processing-title">
          MEMPROSES...
        </div>


        <div class="processing-text">
          Data sedang diverifikasi
          dan dicatat.
        </div>


        <div class="processing-note">
          Anda boleh mencabut
          <br>
          QR code dan menunggu hasil.
        </div>


      </div>


    </div>


    <!-- ===============================================
         HASIL AKHIR
         =============================================== -->

    <div id="result-overlay">

      <!-- Diisi JavaScript -->

    </div>


  </div>



<script>


  // ==================================================
  // URL APPS SCRIPT
  // ==================================================

  const API_URL =
    "https://script.google.com/a/macros/guru.sma.belajar.id/s/AKfycbxy_OJolL3936qcPsBAQ2mTrBdgwvDXPoTP-omVG_GxMtpYjJGXCjSQhls89OUMRJN1Jw/exec";


  let scanner = null;

  let sedangMemproses = false;


  // ==================================================
  // MULAI SCANNER
  // ==================================================

  function mulaiScanner() {


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },


      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      function(decodedText) {


        if (sedangMemproses) {

          return;

        }


        sedangMemproses = true;


        /*
         * Begitu QR terbaca,
         * langsung MEMPROSES.
         */

        tampilkanMemproses();


        /*
         * QR boleh langsung dilepas.
         */

        kirimKeAppsScript(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Tidak melakukan apa-apa.
         */

      }

    )

    .catch(function(error) {


      console.error(error);


      tampilkanError(

        "KAMERA TIDAK DAPAT DIAKTIFKAN",

        "Pastikan izin kamera diberikan."

      );

    });

  }


  // ==================================================
  // MEMPROSES
  // ==================================================

  function tampilkanMemproses() {


    document
      .getElementById("reader")
      .classList
      .add("processing");


    document
      .getElementById("processing-overlay")
      .classList
      .add("active");

  }


  // ==================================================
  // HILANGKAN MEMPROSES
  // ==================================================

  function sembunyikanMemproses() {


    document
      .getElementById("reader")
      .classList
      .remove("processing");


    document
      .getElementById("processing-overlay")
      .classList
      .remove("active");

  }


  // ==================================================
  // KIRIM KE APPS SCRIPT
  // ==================================================

  function kirimKeAppsScript(qrId) {


    const namaCallback =
      "absensiCallback_" +
      Date.now();


    window[namaCallback] =
      function(data) {


        try {

          prosesHasil(
            data,
            qrId
          );

        }

        finally {

          delete window[namaCallback];

        }

      };


    const url =
      API_URL +
      "?qr=" +
      encodeURIComponent(qrId) +
      "&callback=" +
      namaCallback;


    const script =
      document.createElement("script");


    script.src = url;


    script.onerror =
      function() {


        tampilkanError(

          "GAGAL MENGHUBUNGI SERVER",

          "Periksa koneksi internet."

        );


        delete window[namaCallback];

      };


    document.body.appendChild(
      script
    );


    setTimeout(function() {


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


    }, 5000);

  }


  // ==================================================
  // NAMA ADAPTIF
  // ==================================================

  function kelasNama(nama) {


    const panjang =
      nama.length;


    if (panjang <= 20) {

      return "nama-pendek";

    }


    if (panjang <= 28) {

      return "nama-sedang";

    }


    if (panjang <= 38) {

      return "nama-panjang";

    }


    return "nama-sangat-panjang";

  }


  // ==================================================
  // HASIL
  // ==================================================

  function prosesHasil(
    data,
    qrId
  ) {


    sembunyikanMemproses();


    // =================================================
    // HADIR
    // =================================================

    if (
      data.status === "HADIR"
    ) {


      const ukuranNama =
        kelasNama(data.nama);


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="check-circle">

          <div class="check-mark">
            ✓
          </div>

        </div>


        <div class="result-status">
          HADIR
        </div>


        <div class="result-id">
          ${data.id}
        </div>


        <div class="
          result-name
          ${ukuranNama}
        ">
          ${data.nama}
        </div>


        <div class="result-class">
          ${data.kelas}
        </div>


        <hr class="result-line">


        <div class="result-info">


          <div class="info-row">

            <div class="info-icon">
              📅
            </div>

            <div class="info-label">
              Tanggal
            </div>

            <div class="info-value">
              ${data.tanggal}
            </div>

          </div>


          <div class="info-row">

            <div class="info-icon">
              📖
            </div>

            <div class="info-label">
              Pertemuan
            </div>

            <div class="info-value">
              ${data.pertemuan}
            </div>

          </div>


          <div class="info-row">

            <div class="info-icon">
              🕐
            </div>

            <div class="info-label">
              Waktu
            </div>

            <div class="info-value">
              ${data.waktu}
            </div>

          </div>


        </div>


        <div class="success-note">

          Absensi berhasil dicatat.
          <br>
          Terima kasih.

        </div>

      `;


      tampilkanHasil();


      bunyi();


      kembaliKeScanner(2000);

    }


    // =================================================
    // SUDAH ABSEN
    // =================================================

    else if (
      data.status === "SUDAH_ABSEN"
    ) {


      const ukuranNama =
        kelasNama(data.nama);


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="duplicate-icon">

          <div class="duplicate-mark">
            !
          </div>

        </div>


        <div class="duplicate-status">
          SUDAH ABSEN
        </div>


        <div class="result-id">
          ${data.id}
        </div>


        <div class="
          result-name
          ${ukuranNama}
        ">
          ${data.nama}
        </div>


        <div class="result-class">
          ${data.kelas}
        </div>


        <hr class="result-line">


        <div class="result-info">


          <div class="info-row">

            <div class="info-icon">
              📅
            </div>

            <div class="info-label">
              Tanggal
            </div>

            <div class="info-value">
              ${data.tanggal}
            </div>

          </div>


          <div class="info-row">

            <div class="info-icon">
              📖
            </div>

            <div class="info-label">
              Pertemuan
            </div>

            <div class="info-value">
              ${data.pertemuan}
            </div>

          </div>


        </div>

      `;


      tampilkanHasil();


      bunyi();


      kembaliKeScanner(3000);

    }


    // =================================================
    // QR TIDAK DIKENAL
    // =================================================

    else if (
      data.status === "QR_TIDAK_DIKENAL"
    ) {


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="error-icon">
          !
        </div>

        <div class="error-title">
          QR TIDAK DIKENAL
        </div>

        <div class="error-text">

          ID:
          <strong>
            ${qrId}
          </strong>

        </div>

      `;


      tampilkanHasil();


      kembaliKeScanner(3000);

    }


    // =================================================
    // SCANNER NONAKTIF
    // =================================================

    else if (
      data.status === "SCANNER_NONAKTIF"
    ) {


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="error-icon">
          !
        </div>

        <div class="error-title">
          SCANNER NONAKTIF
        </div>

      `;


      tampilkanHasil();


      kembaliKeScanner(3000);

    }


    // =================================================
    // ERROR
    // =================================================

    else {


      tampilkanError(

        "TERJADI KESALAHAN",

        "Silakan coba kembali."

      );

    }

  }


  // ==================================================
  // TAMPILKAN HASIL
  // ==================================================

  function tampilkanHasil() {


    /*
     * Hasil sekarang berada
     * pada LAPISAN PALING ATAS.
     */

    document
      .getElementById("result-overlay")
      .classList
      .add("active");

  }


  // ==================================================
  // KEMBALI KE KAMERA
  // ==================================================

  function kembaliKeScanner(
  waktu
) {


  setTimeout(function() {


    const hasil =
      document.getElementById(
        "result-overlay"
      );


    /*
     * Kamera sudah tetap ON
     * di belakang overlay.
     *
     * Kita hanya membuat
     * layar HADIR menghilang
     * dengan sangat cepat.
     */

    hasil.classList.add(
      "fade-out"
    );


    /*
     * Setelah fade-out selesai,
     * lepaskan overlay sepenuhnya.
     */

    setTimeout(function() {


      hasil.classList.remove(
        "active"
      );


      hasil.classList.remove(
        "fade-out"
      );


      hasil.innerHTML = "";


      /*
       * Scanner siap menerima
       * QR siswa berikutnya.
       */

      sedangMemproses = false;


    }, 180);


  }, waktu);

}

  // ==================================================
  // BUNYI
  // ==================================================

  function bunyi() {


    try {


      const context =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      if (
        context.state === "suspended"
      ) {

        context.resume();

      }


      const oscillator =
        context.createOscillator();


      const gain =
        context.createGain();


      oscillator.connect(gain);

      gain.connect(
        context.destination
      );


      oscillator.frequency.value =
        880;


      gain.gain.value =
        0.15;


      oscillator.start();


      oscillator.stop(
        context.currentTime + 0.12
      );


    }

    catch (error) {


      console.log(
        "Bunyi tidak tersedia:",
        error
      );

    }

  }


  // ==================================================
  // ERROR
  // ==================================================

  function tampilkanError(
    judul,
    keterangan
  ) {


    sembunyikanMemproses();


    document.getElementById(
      "result-overlay"
    ).innerHTML = `

      <div class="error-icon">
        !
      </div>

      <div class="error-title">
        ${judul}
      </div>

      <div class="error-text">
        ${keterangan}
      </div>

    `;


    tampilkanHasil();


    setTimeout(function() {


      document
        .getElementById("result-overlay")
        .classList
        .remove("active");


      sedangMemproses = false;


    }, 3000);

  }


  // ==================================================
  // MULAI
  // ==================================================

  window.onload =
    function() {

      mulaiScanner();

    };


</script>


</body>

</html>
