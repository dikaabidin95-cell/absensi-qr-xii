<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Scanner Absensi XII</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px 16px 20px;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 4px 0 2px;
      font-size: 25px;
      line-height: 1.2;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 8px;
    }

    /*
     * KOTAK SCANNER
     * Diposisikan lebih ke atas
     */

    #reader {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    /*
     * HASIL SCAN
     */

    #hasil {
      width: 100%;
      max-width: 430px;
      min-height: 125px;

      margin: 10px auto 0;

      padding: 16px 12px;

      background: #ffffff;

      border-radius: 14px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      font-size: 18px;

      line-height: 1.35;
    }

    /*
     * MENUNGGU SCAN
     */

    .menunggu {
      color: #777;
      font-size: 18px;
      font-weight: normal;
    }

    /*
     * HADIR
     */

    .hadir {
      color: #168a3a;
      font-size: 30px;
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    /*
     * NAMA SISWA
     */

    .nama-siswa {
      color: #111;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.25;

      width: 100%;

      overflow-wrap: break-word;
      word-break: normal;
    }

    /*
     * KELAS
     */

    .kelas-siswa {
      color: #555;
      font-size: 17px;
      margin-top: 5px;
    }

    /*
     * SUDAH ABSEN
     */

    .sudah {
      color: #d68b00;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    /*
     * ERROR
     */

    .error {
      color: #c62828;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.2;
    }

  </style>

</head>


<body>


  <h1>
    ABSENSI KIMIA XII
  </h1>


  <div class="subtitle">
    Arahkan QR siswa ke kamera
  </div>


  <!-- KAMERA -->

  <div id="reader"></div>


  <!-- HASIL SCAN -->

  <div id="hasil">

    <div class="menunggu">
      MENUNGGU SCAN
    </div>

  </div>


<script>


  /*
   * ==================================================
   * URL APPS SCRIPT
   * ==================================================
   */

  const API_URL =
    "https://script.google.com/a/macros/guru.sma.belajar.id/s/AKfycbxy_OJolL3936qcPsBAQ2mTrBdgwvDXPoTP-omVG_GxMtpYjJGXCjSQhls89OUMRJN1Jw/exec";


  let scanner = null;

  let sedangMemproses = false;


  /*
   * ==================================================
   * MULAI SCANNER
   * ==================================================
   */

  function mulaiScanner() {

    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },


      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },


      function(decodedText) {


        if (sedangMemproses) {

          return;

        }


        sedangMemproses = true;


        kirimKeAppsScript(decodedText);

      },


      function(errorMessage) {

        /*
         * Scanner tetap aktif.
         */

      }

    )

    .catch(function(error) {


      console.error(error);


      tampilkanError(
        "KAMERA TIDAK DAPAT DIAKTIFKAN"
      );


    });

  }


  /*
   * ==================================================
   * KIRIM QR KE APPS SCRIPT
   * ==================================================
   */

  function kirimKeAppsScript(qrId) {


    const namaCallback =
      "absensiCallback_" +
      Date.now();


    window[namaCallback] =
      function(data) {


        try {

          prosesHasil(
            data,
            qrId
          );

        }

        finally {

          delete window[namaCallback];

        }

      };


    const url =
      API_URL +
      "?qr=" +
      encodeURIComponent(qrId) +
      "&callback=" +
      namaCallback;


    const script =
      document.createElement("script");


    script.src = url;


    script.onerror =
      function() {


        tampilkanError(
          "GAGAL MENGHUBUNGI SERVER"
        );


        delete window[namaCallback];


        setTimeout(function() {

          sedangMemproses = false;

        }, 3000);


      };


    document.body.appendChild(script);


    setTimeout(function() {


      if (script.parentNode) {

        script.parentNode.removeChild(script);

      }


    }, 5000);

  }


  /*
   * ==================================================
   * HASIL DARI APPS SCRIPT
   * ==================================================
   */

  function prosesHasil(data, qrId) {


    /*
     * ================================================
     * HADIR
     * ================================================
     */

    if (data.status === "HADIR") {


      document.getElementById("hasil").innerHTML = `

        <div class="hadir">
          ● HADIR
        </div>

        <div class="nama-siswa">
          ${data.nama}
        </div>

        <div class="kelas-siswa">
          ${data.kelas}
        </div>

      `;


      bunyi();

    }


    /*
     * ================================================
     * SUDAH ABSEN
     * ================================================
     */

    else if (
      data.status === "SUDAH_ABSEN"
    ) {


      document.getElementById("hasil").innerHTML = `

        <div class="sudah">
          ● SUDAH ABSEN
        </div>

        <div class="nama-siswa">
          ${data.nama}
        </div>

        <div class="kelas-siswa">
          ${data.kelas}
        </div>

      `;


      bunyi();

    }


    /*
     * ================================================
     * QR TIDAK DIKENAL
     * ================================================
     */

    else if (
      data.status === "QR_TIDAK_DIKENAL"
    ) {


      document.getElementById("hasil").innerHTML = `

        <div class="error">
          ● QR TIDAK DIKENAL
        </div>

        <div style="
          margin-top:8px;
          font-size:17px;
          color:#555;
        ">
          ID: <strong>${qrId}</strong>
        </div>

      `;

    }


    /*
     * ================================================
     * SCANNER NONAKTIF
     * ================================================
     */

    else if (
      data.status === "SCANNER_NONAKTIF"
    ) {


      document.getElementById("hasil").innerHTML = `

        <div class="error">
          ● SCANNER NONAKTIF
        </div>

      `;

    }


    /*
     * ================================================
     * ERROR LAIN
     * ================================================
     */

    else {


      document.getElementById("hasil").innerHTML = `

        <div class="error">
          ● TERJADI KESALAHAN
        </div>

      `;

    }


    /*
     * ================================================
     * TAMPILKAN HASIL SELAMA 3 DETIK
     * ================================================
     */

    setTimeout(function() {


      sedangMemproses = false;


      document.getElementById("hasil").innerHTML = `

        <div class="menunggu">
          MENUNGGU SCAN
        </div>

      `;


    }, 3000);

  }


  /*
   * ==================================================
   * BUNYI
   * ==================================================
   */

  function bunyi() {


    try {


      const context =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      if (
        context.state === "suspended"
      ) {

        context.resume();

      }


      const oscillator =
        context.createOscillator();


      const gain =
        context.createGain();


      oscillator.connect(gain);

      gain.connect(
        context.destination
      );


      oscillator.frequency.value =
        880;


      gain.gain.value =
        0.15;


      oscillator.start();


      oscillator.stop(
        context.currentTime + 0.12
      );


    }

    catch (error) {


      console.log(
        "Bunyi tidak tersedia:",
        error
      );


    }

  }


  /*
   * ==================================================
   * ERROR
   * ==================================================
   */

  function tampilkanError(pesan) {


    document.getElementById(
      "hasil"
    ).innerHTML = `

      <div class="error">
        ● ${pesan}
      </div>

    `;

  }


  /*
   * ==================================================
   * MULAI
   * ==================================================
   */

  window.onload =
    function() {

      mulaiScanner();

    };


</script>


</body>

</html>
