<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Absensi TKA Kimia 2026</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 10px 14px 20px;

      background: #f5f7fa;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    h1 {

      margin: 4px 0 2px;

      font-size: 25px;

      line-height: 1.2;

    }


    .subtitle {

      color: #666;

      font-size: 15px;

      margin-bottom: 8px;

    }


    /* =================================================
       AREA UTAMA SCANNER
       ================================================= */

    #scanner-wrapper {

      width: 100%;

      max-width: 430px;

      margin: 0 auto;

      position: relative;

      overflow: hidden;

      border-radius: 14px;

    }


    #reader {

      width: 100%;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      transition:
        filter 0.18s ease;

    }


    /* =================================================
       BLUR SAAT MEMPROSES
       ================================================= */

    #reader.processing {

      filter: blur(7px);

    }


    /* =================================================
       OVERLAY MEMPROSES
       ================================================= */

    #processing-overlay {

      position: absolute;

      inset: 0;

      z-index: 20;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      padding: 20px;

      background:
        rgba(10, 25, 30, 0.58);

      backdrop-filter:
        blur(4px);

      color: white;

    }


    #processing-overlay.active {

      display: flex;

    }


    .processing-card {

      width: 88%;

      max-width: 330px;

      padding: 25px 18px;

      border:

        3px solid #f5bd27;

      border-radius: 20px;

      background:

        rgba(20, 25, 25, 0.62);

      box-shadow:

        0 8px 30px
        rgba(0,0,0,0.25);

    }


    .processing-icon {

      width: 52px;

      height: 52px;

      margin: 0 auto 13px;

      border:

        6px solid #f5bd27;

      border-top-color:

        transparent;

      border-radius: 50%;

      animation:

        putar 0.9s linear infinite;

    }


    @keyframes putar {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }


    .processing-title {

      font-size: 27px;

      font-weight: bold;

      color: #ffd044;

    }


    .processing-text {

      margin-top: 10px;

      font-size: 16px;

      line-height: 1.4;

    }


    .processing-note {

      margin-top: 17px;

      padding: 10px 12px;

      border:

        1px solid
        rgba(255,255,255,0.5);

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.4;

    }


    /* =================================================
       OVERLAY HASIL
       ================================================= */

    #result-overlay {

      position: absolute;

      inset: 0;

      z-index: 30;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      padding: 22px 16px;

      color: white;

      background:

        linear-gradient(
          180deg,
          #082c31 0%,
          #061b20 100%
        );

      border-radius: 14px;

      text-align: center;

    }


    #result-overlay.active {

      display: flex;

    }


    /* =================================================
       IKON HADIR
       ================================================= */

    .check-circle {

      width: 72px;

      height: 72px;

      border:

        5px solid #65e85b;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 9px;

      box-shadow:

        0 0 18px
        rgba(101,232,91,0.35);

    }


    .check-mark {

      font-size: 48px;

      line-height: 1;

      font-weight: bold;

      color: #65e85b;

      transform:
        translateY(-2px);

    }


    .result-status {

      font-size: 34px;

      font-weight: bold;

      color: #65e85b;

      line-height: 1.05;

    }


    .result-id {

      margin-top: 10px;

      font-size: 20px;

      font-weight: bold;

      color: white;

    }


    .result-name {

      margin-top: 5px;

      width: 100%;

      font-weight: bold;

      line-height: 1.2;

      color: white;

      padding: 0 5px;

      overflow-wrap: anywhere;

    }


    .nama-pendek {

      font-size: 21px;

    }


    .nama-sedang {

      font-size: 19px;

    }


    .nama-panjang {

      font-size: 17px;

    }


    .nama-sangat-panjang {

      font-size: 15px;

    }


    .result-class {

      margin-top: 5px;

      font-size: 16px;

      color: #e3eeee;

    }


    .result-line {

      width: 88%;

      max-width: 330px;

      margin: 14px auto 11px;

      border: 0;

      border-top:

        1px solid
        rgba(255,255,255,0.25);

    }


    .result-info {

      width: 100%;

      max-width: 330px;

      text-align: left;

      font-size: 15px;

      line-height: 1.65;

    }


    .info-row {

      display: grid;

      grid-template-columns:
        28px 1fr auto;

      align-items: center;

      column-gap: 5px;

    }


    .info-icon {

      font-size: 17px;

    }


    .info-label {

      color: #d8e6e8;

    }


    .info-value {

      color: white;

      font-weight: bold;

      text-align: right;

    }


    .success-note {

      width: 100%;

      max-width: 330px;

      margin-top: 12px;

      padding: 9px 10px;

      border:

        2px solid #65e85b;

      border-radius: 10px;

      background:

        rgba(25,100,45,0.25);

      font-size: 14px;

      line-height: 1.35;

      color: white;

    }


    /* =================================================
       SUDAH ABSEN
       ================================================= */

    .duplicate-icon {

      width: 68px;

      height: 68px;

      border:

        5px solid #f4b63e;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 10px;

    }


    .duplicate-mark {

      font-size: 38px;

      font-weight: bold;

      color: #f4b63e;

    }


    .duplicate-status {

      font-size: 27px;

      font-weight: bold;

      color: #f4b63e;

    }


    /* =================================================
       ERROR
       ================================================= */

    .error-icon {

      font-size: 42px;

      color: #ff6b6b;

      margin-bottom: 8px;

    }


    .error-title {

      font-size: 24px;

      font-weight: bold;

      color: #ff6b6b;

    }


    .error-text {

      margin-top: 8px;

      font-size: 16px;

      color: white;

    }


    /* =================================================
       MOBILE
       ================================================= */

    @media (max-width: 360px) {

      body {

        padding-left: 8px;

        padding-right: 8px;

      }


      h1 {

        font-size: 22px;

      }


      .subtitle {

        font-size: 14px;

      }


      .result-status {

        font-size: 30px;

      }


      .result-id {

        font-size: 18px;

      }


      .nama-pendek {

        font-size: 19px;

      }


      .nama-sedang {

        font-size: 17px;

      }


      .nama-panjang {

        font-size: 15px;

      }


      .nama-sangat-panjang {

        font-size: 14px;

      }


      .result-info {

        font-size: 14px;

      }

    }

  </style>

</head>


<body>


  <h1>
    ABSENSI TKA KIMIA 2026
  </h1>


  <div class="subtitle">
    Scanner QR Siswa
  </div>


  <!-- =================================================
       SCANNER WRAPPER
       ================================================= -->

  <div id="scanner-wrapper">


    <!-- KAMERA -->

    <div id="reader"></div>


    <!-- =================================================
         MEMPROSES
         ================================================= -->

    <div id="processing-overlay">


      <div class="processing-card">


        <div class="processing-icon"></div>


        <div class="processing-title">
          MEMPROSES...
        </div>


        <div class="processing-text">
          Data sedang diverifikasi
          dan dicatat.
        </div>


        <div class="processing-note">
          Anda boleh mencabut
          <br>
          QR code dan menunggu hasil.
        </div>


      </div>


    </div>


    <!-- =================================================
         HASIL AKHIR
         ================================================= -->

    <div id="result-overlay">

      <!-- Isi hasil dibuat oleh JavaScript -->

    </div>


  </div>



<script>


  // ====================================================
  // URL APPS SCRIPT
  // ====================================================

  const API_URL =
    "https://script.google.com/a/macros/guru.sma.belajar.id/s/AKfycbxy_OJolL3936qcPsBAQ2mTrBdgwvDXPoTP-omVG_GxMtpYjJGXCjSQhls89OUMRJN1Jw/exec";


  let scanner = null;

  let sedangMemproses = false;


  // ====================================================
  // MULAI SCANNER
  // ====================================================

  function mulaiScanner() {


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },


      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      function(decodedText) {


        if (sedangMemproses) {

          return;

        }


        sedangMemproses = true;


        /*
         * LANGSUNG pindah ke
         * MEMPROSES.
         */

        tampilkanMemproses();


        /*
         * Kirim QR ke server.
         */

        kirimKeAppsScript(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Abaikan error pembacaan
         * selama kamera aktif.
         */

      }

    )

    .catch(function(error) {


      console.error(error);


      tampilkanError(
        "KAMERA TIDAK DAPAT DIAKTIFKAN",
        "Pastikan izin kamera diberikan."
      );


    });

  }


  // ====================================================
  // MEMPROSES
  // ====================================================

  function tampilkanMemproses() {


    document
      .getElementById("reader")
      .classList
      .add("processing");


    document
      .getElementById("processing-overlay")
      .classList
      .add("active");

  }


  // ====================================================
  // SEMBUNYIKAN MEMPROSES
  // ====================================================

  function sembunyikanMemproses() {


    document
      .getElementById("reader")
      .classList
      .remove("processing");


    document
      .getElementById("processing-overlay")
      .classList
      .remove("active");

  }


  // ====================================================
  // KIRIM KE APPS SCRIPT
  // ====================================================

  function kirimKeAppsScript(qrId) {


    const namaCallback =
      "absensiCallback_" +
      Date.now();


    window[namaCallback] =
      function(data) {


        try {

          prosesHasil(
            data,
            qrId
          );

        }

        finally {

          delete window[namaCallback];

        }

      };


    const url =
      API_URL +
      "?qr=" +
      encodeURIComponent(qrId) +
      "&callback=" +
      namaCallback;


    const script =
      document.createElement("script");


    script.src = url;


    script.onerror =
      function() {


        tampilkanError(

          "GAGAL MENGHUBUNGI SERVER",

          "Periksa koneksi internet."

        );


        delete window[namaCallback];


      };


    document.body.appendChild(
      script
    );


    setTimeout(function() {


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


    }, 5000);

  }


  // ====================================================
  // KELAS NAMA ADAPTIF
  // ====================================================

  function kelasNama(nama) {


    const panjang =
      nama.length;


    if (panjang <= 20) {

      return "nama-pendek";

    }


    if (panjang <= 28) {

      return "nama-sedang";

    }


    if (panjang <= 38) {

      return "nama-panjang";

    }


    return "nama-sangat-panjang";

  }


  // ====================================================
  // HASIL
  // ====================================================

  function prosesHasil(
    data,
    qrId
  ) {


    sembunyikanMemproses();


    // ================================================
    // HADIR
    // ================================================

    if (
      data.status === "HADIR"
    ) {


      const kelasNamaSiswa =
        kelasNama(data.nama);


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="check-circle">

          <div class="check-mark">
            ✓
          </div>

        </div>


        <div class="result-status">
          HADIR
        </div>


        <div class="result-id">
          ${data.id}
        </div>


        <div class="
          result-name
          ${kelasNamaSiswa}
        ">
          ${data.nama}
        </div>


        <div class="result-class">
          ${data.kelas}
        </div>


        <hr class="result-line">


        <div class="result-info">


          <div class="info-row">

            <div class="info-icon">
              📅
            </div>

            <div class="info-label">
              Tanggal
            </div>

            <div class="info-value">
              ${data.tanggal}
            </div>

          </div>


          <div class="info-row">

            <div class="info-icon">
              📖
            </div>

            <div class="info-label">
              Pertemuan
            </div>

            <div class="info-value">
              ${data.pertemuan}
            </div>

          </div>


          <div class="info-row">

            <div class="info-icon">
              🕐
            </div>

            <div class="info-label">
              Waktu
            </div>

            <div class="info-value">
              ${data.waktu}
            </div>

          </div>


        </div>


        <div class="success-note">

          Absensi berhasil dicatat.
          <br>
          Terima kasih.

        </div>

      `;


      tampilkanHasil();


      bunyi();


      kembaliKeScanner(
        3000
      );

    }


    // ================================================
    // SUDAH ABSEN
    // ================================================

    else if (
      data.status === "SUDAH_ABSEN"
    ) {


      const kelasNamaSiswa =
        kelasNama(data.nama);


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="duplicate-icon">

          <div class="duplicate-mark">
            !
          </div>

        </div>


        <div class="duplicate-status">
          SUDAH ABSEN
        </div>


        <div class="result-id">
          ${data.id}
        </div>


        <div class="
          result-name
          ${kelasNamaSiswa}
        ">
          ${data.nama}
        </div>


        <div class="result-class">
          ${data.kelas}
        </div>


        <hr class="result-line">


        <div class="result-info">


          <div class="info-row">

            <div class="info-icon">
              📅
            </div>

            <div class="info-label">
              Tanggal
            </div>

            <div class="info-value">
              ${data.tanggal}
            </div>

          </div>


          <div class="info-row">

            <div class="info-icon">
              📖
            </div>

            <div class="info-label">
              Pertemuan
            </div>

            <div class="info-value">
              ${data.pertemuan}
            </div>

          </div>


        </div>


      `;


      tampilkanHasil();


      bunyi();


      kembaliKeScanner(
        3000
      );

    }


    // ================================================
    // QR TIDAK DIKENAL
    // ================================================

    else if (
      data.status === "QR_TIDAK_DIKENAL"
    ) {


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="error-icon">
          !
        </div>

        <div class="error-title">
          QR TIDAK DIKENAL
        </div>

        <div class="error-text">
          ID:
          <strong>
            ${qrId}
          </strong>
        </div>

      `;


      tampilkanHasil();


      kembaliKeScanner(
        3000
      );

    }


    // ================================================
    // SCANNER NONAKTIF
    // ================================================

    else if (
      data.status === "SCANNER_NONAKTIF"
    ) {


      document.getElementById(
        "result-overlay"
      ).innerHTML = `

        <div class="error-icon">
          !
        </div>

        <div class="error-title">
          SCANNER NONAKTIF
        </div>

      `;


      tampilkanHasil();


      kembaliKeScanner(
        3000
      );

    }


    // ================================================
    // ERROR LAIN
    // ================================================

    else {


      tampilkanError(
        "TERJADI KESALAHAN",
        "Silakan coba kembali."
      );

    }

  }


  // ====================================================
  // TAMPILKAN HASIL PENUH
  // ====================================================

  function tampilkanHasil() {


    document
      .getElementById(
        "result-overlay"
      )
      .classList
      .add("active");

  }


  // ====================================================
  // KEMBALI KE SCANNER
  // ====================================================

  function kembaliKeScanner(
    waktu
  ) {


    setTimeout(function() {


      document
        .getElementById(
          "result-overlay"
        )
        .classList
        .remove("active");


      document.getElementById(
        "result-overlay"
      ).innerHTML = "";


      sedangMemproses = false;


    }, waktu);

  }


  // ====================================================
  // BUNYI
  // ====================================================

  function bunyi() {


    try {


      const context =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      if (
        context.state === "suspended"
      ) {

        context.resume();

      }


      const oscillator =
        context.createOscillator();


      const gain =
        context.createGain();


      oscillator.connect(gain);

      gain.connect(
        context.destination
      );


      oscillator.frequency.value =
        880;


      gain.gain.value =
        0.15;


      oscillator.start();


      oscillator.stop(
        context.currentTime + 0.12
      );


    }

    catch (error) {


      console.log(
        "Bunyi tidak tersedia:",
        error
      );

    }

  }


  // ====================================================
  // ERROR
  // ====================================================

  function tampilkanError(
    judul,
    keterangan
  ) {


    sembunyikanMemproses();


    document.getElementById(
      "result-overlay"
    ).innerHTML = `

      <div class="error-icon">
        !
      </div>

      <div class="error-title">
        ${judul}
      </div>

      <div class="error-text">
        ${keterangan}
      </div>

    `;


    tampilkanHasil();


    setTimeout(function() {


      document
        .getElementById(
          "result-overlay"
        )
        .classList
        .remove("active");


      sedangMemproses = false;


    }, 3000);

  }


  // ====================================================
  // MULAI
  // ====================================================

  window.onload =
    function() {

      mulaiScanner();

    };


</script>


</body>

</html>
